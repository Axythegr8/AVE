workflows:
  native-swift-build:
    name: Build AVE App
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Generate App Structure and Compile
        script: |
          set -e
          echo "📁 Creating temporary native iOS directory structure..."
          mkdir -p build/AVEApp.app
          
          echo "⚙️ Compiling all Swift files with native iOS SDK..."
          xcrun -sdk iphoneos swiftc -O \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -target arm64-apple-ios15.0 \
            AVEApp.swift ContentView.swift VideoEditorViewModel.swift \
            -o build/AVEApp.app/AVEApp
          
          echo "📄 Embedding configuration security plist..."
          cp Info.plist build/AVEApp.app/Info.plist
          
          echo "📦 Wrapping binaries into installable iOS Payload..."
          mkdir -p Payload
          cp -r build/AVEApp.app Payload/
          zip -r AVEApp.ipa Payload
          
          echo "✅ Compilation completely successful!"
    artifacts:
      - "*.ipa"
