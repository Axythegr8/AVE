workflows:
  native-swift-build:
    name: Build AVE App
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Auto Generation and Device Compile
        script: |
          set -e
          echo "🛠️ Creating structural project specification file..."
          cat << 'EOF' > project.yml
          name: AVEApp
          options:
            bundleIdPrefix: com.personal
          targets:
            AVEApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: AVEApp.swift
                - path: ContentView.swift
                - path: VideoEditorViewModel.swift
                - path: Info.plist
          EOF

          echo "🚀 Installing project building engines..."
          brew install xcodegen

          echo "📁 Engineering active Xcode directory structures..."
          xcodegen generate

          echo "⚙️ Compiling architecture via official Apple SDKs..."
          xcodebuild -project AVEApp.xcodeproj \
            -scheme AVEApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo "📦 Packaging native application contents to archive archive payload container..."
          mkdir -p Payload
          cp -r build/Release-iphoneos/AVEApp.app Payload/
          zip -r AVEApp.ipa Payload

          echo "✅ Machine compilation complete!"
    artifacts:
      - "*.ipa"
