workflows:
  native-swift-build:
    name: Build AVE App
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Initialize Package and Compile Native App
        script: |
          set -e
          echo "📦 Initializing native Swift package structure..."
          rm -rf Package.swift Sources
          swift package init --type executable --name AVEApp
          
          echo "📁 Moving codebase to source target directory..."
          rm -f Sources/main.swift
          cp AVEApp.swift Sources/
          cp ContentView.swift Sources/
          cp VideoEditorViewModel.swift Sources/
          
          echo "⚙️ Running machine compilation toolchain..."
          swift build -c release
          
          echo "📁 Creating temporary native iOS directory structure..."
          mkdir -p build/AVEApp.app
          
          echo "🚀 Copying compiled release binary..."
          cp .build/release/AVEApp build/AVEApp.app/AVEApp
          
          echo "📄 Embedding configuration security plist..."
          cp Info.plist build/AVEApp.app/Info.plist
          
          echo "📦 Wrapping binaries into installable iOS Payload..."
          mkdir -p Payload
          cp -r build/AVEApp.app Payload/
          zip -r AVEApp.ipa Payload
          
          echo "✅ Compilation completely successful!"
    artifacts:
      - "*.ipa"
