workflows:
  ios-workflow:
    name: iOS Workflow
    scripts:
      # ADD THIS NEW SCRIPT BLOCK FIRST:
      - name: Generate Xcode Project with XcodeGen
        script: |
          brew install xcodegen
          xcodegen generate

      # YOUR EXISTING BUILD SCRIPT (ensure it points to the generated project):
      - name: Build iOS app
        script: |
          xcodebuild build -project "AVE.xcodeproj" -scheme "AVE" -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO
