workflows:
  native-swift-build:
    name: Build AVE App
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Auto-Repair and Compile
        script: |
          set -e
          
          # 1. FORCE FILE ORGANIZATION (Self-Healing)
          echo "📁 Organizing files into Sources folder..."
          mkdir -p Sources
          
          # Move files ONLY if they are currently in the root folder
          [ -f "AVEApp.swift" ] && mv AVEApp.swift Sources/
          [ -f "ContentView.swift" ] && mv ContentView.swift Sources/
          [ -f "VideoEditorViewModel.swift" ] && mv VideoEditorViewModel.swift Sources/
          [ -f "Info.plist" ] && mv Info.plist Sources/
          
          # 2. GENERATE PROJECT STRUCTURE
          echo "🛠️ Generating Project Spec..."
          cat << 'EOF' > project.yml
          name: AVEApp
          options:
            bundleIdPrefix: com.personal
          targets:
            AVEApp:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                INFOPLIST_FILE: Sources/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.personal.aveapp
          EOF

          # 3. INSTALL & GENERATE XCODE PROJECT
          echo "🚀 Installing XcodeGen..."
          brew install xcodegen
          
          echo "📁 Generating Xcode Project..."
          xcodegen generate

          # 4. BUILD APP
          echo "⚙️ Building App..."
          xcodebuild -project AVEApp.xcodeproj \
            -scheme AVEApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # 5. PACKAGE IPA
          echo "📦 Packaging IPA..."
          mkdir -p Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/AVEApp.app Payload/
          zip -r AVEApp.ipa Payload

          echo "✅ Build Complete!"
    artifacts:
      - "*.ipa"
