workflows:
  ios-final-build:
    name: Build AVE App
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compile All Files
        script: |
          set -e
          echo "🚀 Starting Build..."
          
          # 1. Create App Folder
          mkdir -p build/AVEApp.app
          
          # 2. Compile ALL .swift files together
          # We use *.swift to grab both AVEApp.swift and ContentView.swift
          echo "⚙️ Compiling Swift Files..."
          xcrun -sdk iphoneos swiftc *.swift \
            -o build/AVEApp.app/AVEApp \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Vision \
            -framework UIKit \
            -framework Photos
          
          # 3. Copy the Info.plist you just created
          if [ -f Info.plist ]; then
             cp Info.plist build/AVEApp.app/Info.plist
          else
             echo "❌ CRITICAL ERROR: You forgot to create Info.plist!"
             exit 1
          fi
          
          # 4. Zip it
          mkdir -p Payload
          cp -r build/AVEApp.app Payload/
          zip -r AVEApp.ipa Payload
          
          echo "✅ SUCCESS! Download your IPA."
    artifacts:
      - AVEApp.ipa
