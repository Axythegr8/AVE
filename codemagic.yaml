workflows:
  ios-diagnostic-build:
    name: Diagnose AVE App Error
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compile All Files
        script: |
          set +e # Do not crash immediately, let us read the error log
          
          echo "📁 Repository Contents:"
          ls -la
          
          mkdir -p build/AVEApp.app
          
          echo "⚙️ Compiling and saving error logs..."
          xcrun -sdk iphoneos swiftc *.swift \
            -o build/AVEApp.app/AVEApp \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Vision \
            -framework UIKit \
            -framework Photos \
            2> compiler_errors.txt
          
          if [ -f "build/AVEApp.app/AVEApp" ]; then
            echo "✅ Compilation actually worked! Packaging IPA..."
            cp Info.plist build/AVEApp.app/Info.plist
            mkdir -p Payload && cp -r build/AVEApp.app Payload/
            zip -r AVEApp.ipa Payload
          else
            echo "❌ COMPILER CRASHED! Here is the exact reason why:"
            echo "===================================================="
            cat compiler_errors.txt
            echo "===================================================="
            exit 1
          fi
    artifacts:
      - compiler_errors.txt
